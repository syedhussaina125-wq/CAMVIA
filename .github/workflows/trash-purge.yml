name: CAMVIA Daily Trash Purge

on:
  schedule:
    # Runs daily at 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  purge:
    name: Purge Expired Trash Records
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Purge Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Required secrets SUPABASE_URL and SUPABASE_SECRET_KEY must be configured."
            exit 1
          fi
          RESPONSE=$(curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request POST "$SUPABASE_URL/functions/v1/purge-expired-trash" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "Content-Type: application/json")
          echo "Purge outcome: $RESPONSE"
